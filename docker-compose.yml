version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BEATOVEN_API_URL=${BEATOVEN_API_URL:-https://sync.beatoven.ai/api}
      - BEATOVEN_API_KEY=${BEATOVEN_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-5}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  redis-data:
